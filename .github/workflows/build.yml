name: Build Boxes and Diamonds

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      olp_repository:
        description: 'Repository containing the matching OpenLogic-Zh fork (OWNER/REPO)'
        required: false
        type: string
      olp_ref:
        description: 'Branch or tag of the OpenLogic-Zh fork'
        required: false
        default: main
        type: string

env:
  OLP_REPOSITORY: ${{ inputs.olp_repository || vars.OLP_REPOSITORY || format('{0}/OpenLogic-Zh', github.repository_owner) }}
  OLP_REF: ${{ inputs.olp_ref || vars.OLP_REF || 'main' }}

jobs:
  build-english:
    name: Build English comparison
    runs-on: ubuntu-latest
    steps:
      - name: Check out B&D driver
        uses: actions/checkout@v4
        with:
          path: boxes-and-diamonds-zh
      - name: Check out matching Open Logic fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ env.OLP_REF }}
          path: OpenLogic-Zh
      - name: Fetch cover portraits
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/fetch-portraits.sh
      - name: Install poppler-utils for PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Compile English screen PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: bd-screen.tex
          working_directory: boxes-and-diamonds-zh
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check English output
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/check-build.sh bd-screen

  build-chinese:
    name: Build Chinese release PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Check out B&D driver
        uses: actions/checkout@v4
        with:
          path: boxes-and-diamonds-zh
      - name: Check out matching OpenLogic-Zh fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ env.OLP_REF }}
          path: OpenLogic-Zh
      - name: Fetch cover portraits
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/fetch-portraits.sh
      - name: Install poppler-utils for PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Compile Chinese PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            zh-bd-screen.tex
            zh-bd-print.tex
          working_directory: boxes-and-diamonds-zh
          args: -xelatex -interaction=nonstopmode -halt-on-error
      - name: Check Chinese output
        working-directory: boxes-and-diamonds-zh
        run: |
          sh scripts/check-build.sh zh-bd-screen
          sh scripts/check-build.sh zh-bd-print
      - name: Upload Chinese PDFs
        uses: actions/upload-artifact@v4
        with:
          name: boxes-and-diamonds-zh
          path: |
            boxes-and-diamonds-zh/zh-bd-screen.pdf
            boxes-and-diamonds-zh/zh-bd-print.pdf

  release-please:
    name: Prepare or publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - build-english
      - build-chinese
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          release-type: simple
          target-branch: master
      - name: Download Chinese PDFs
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/download-artifact@v4
        with:
          name: boxes-and-diamonds-zh
          path: release-assets
      - name: Attach Chinese PDFs to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag_name }}"
          release-assets/zh-bd-screen.pdf
          release-assets/zh-bd-print.pdf
          --clobber
