name: Build Boxes and Diamonds

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [olp-updated]
    inputs:
      olp_repository:
        description: 'Repository containing the matching OpenLogic-Zh fork (OWNER/REPO)'
        required: false
        type: string
      olp_ref:
        description: 'Branch or tag of the OpenLogic-Zh fork'
        required: false
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLP_REPOSITORY: ${{ inputs.olp_repository || vars.OLP_REPOSITORY || format('{0}/OpenLogic-Zh', github.repository_owner) }}
  OLP_REF: ${{ inputs.olp_ref || vars.OLP_REF || 'main' }}

# 只有默认分支的 push 才需要构建；PR 与手动触发总是构建。
# workflow 级 on.push 无法写分支表达式（$default-branch 有已知 bug），
# 故在 job 级用 default_branch 判断。
jobs:
  changes:
    name: Detect shared-layer changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
      # repository_dispatch（openlogic-zh 翻译更新触发）只重建中文 PDF，
      # 不检测共享层变化，也就跳过英文回归构建。
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'repository_dispatch'
        with:
          filters: |
            shared:
              - 'include/**'
              - 'bd.tex'
              - 'bd-*.tex'
              - 'bd-*.sty'
              - 'olprevision.tex'
              - '.github/**'
              - 'scripts/**'

  build-english:
    name: Build English comparison
    needs: changes
    if: >-
      needs.changes.outputs.shared == 'true' &&
      (github.event_name != 'push' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - name: Check out B&D driver
        uses: actions/checkout@v7
        with:
          path: boxes-and-diamonds-zh
          fetch-depth: 0
      - name: Check out matching Open Logic fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ env.OLP_REF }}
          path: OpenLogic-Zh
      - name: Fetch cover portraits
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/fetch-portraits.sh
      - name: Install poppler-utils for PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fetch tags for version stamp
        working-directory: boxes-and-diamonds-zh
        run: git fetch --tags --force origin
      - name: Stamp OpenLogic-Zh revision into olprevision.tex
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/stamp-olprevision.sh ../OpenLogic-Zh
      - name: Compile English screen PDF
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: bd-screen.tex
          working_directory: boxes-and-diamonds-zh
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check English output
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/check-build.sh bd-screen

  build-chinese:
    name: Build Chinese release PDFs
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out B&D driver
        uses: actions/checkout@v7
        with:
          path: boxes-and-diamonds-zh
          fetch-depth: 0
      - name: Check out matching OpenLogic-Zh fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ env.OLP_REF }}
          path: OpenLogic-Zh
      - name: Fetch cover portraits
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/fetch-portraits.sh
      - name: Install poppler-utils for PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fetch tags for version stamp
        working-directory: boxes-and-diamonds-zh
        run: git fetch --tags --force origin
      - name: Stamp OpenLogic-Zh revision into olprevision.tex
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/stamp-olprevision.sh ../OpenLogic-Zh
      - name: Compile Chinese PDFs
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: |
            zh-bd-screen.tex
            zh-bd-print.tex
          working_directory: boxes-and-diamonds-zh
          args: -xelatex -interaction=nonstopmode -halt-on-error
      - name: Check Chinese output
        working-directory: boxes-and-diamonds-zh
        run: |
          sh scripts/check-build.sh zh-bd-screen
          sh scripts/check-build.sh zh-bd-print
      - name: Upload Chinese PDFs
        uses: actions/upload-artifact@v7
        with:
          name: boxes-and-diamonds-zh
          path: |
            boxes-and-diamonds-zh/zh-bd-screen.pdf
            boxes-and-diamonds-zh/zh-bd-print.pdf
      # 翻译同步提交：OLP 更新触发的 dispatch 构建成功后，把 stamp 过的
      # olprevision.tex（记录实际 OLP 修订）作为 fix: 提交推回 master，
      # 让 release-please 自动开出下一个版本（0.0.x）的 release PR。
      # 若 OLP 无新修订（diff 为空）则跳过，避免循环触发。
      - name: Commit synced translation revision
        if: github.event_name == 'repository_dispatch'
        working-directory: boxes-and-diamonds-zh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet olprevision.tex && git diff --quiet bdversion.tex; then
            echo "olprevision.tex/bdversion.tex unchanged; no sync commit needed"
            exit 0
          fi
          rev=$(sed -n 's/.*{\([0-9a-f]*\) (.*/\1/p' olprevision.tex)
          git add olprevision.tex bdversion.tex
          git commit -m "fix: sync translation with openlogic-zh@$rev"
          git pull --rebase origin master
          git push origin master

  release-please:
    name: Prepare or publish release
    # push（发版或常规提交）与 repository_dispatch（OLP 翻译同步，
    # sync commit 已在 build-chinese 里推回 master）都触发。
    # 无新提交时 release-please 自动跳过。
    if: >-
      (github.event_name == 'push' || github.event_name == 'repository_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - build-chinese
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # dispatch 时 sync commit 刚由 build-chinese 推回 master，
      # 重新拉取以确保 release-please 看到最新提交
      - name: Fetch latest master
        if: github.event_name == 'repository_dispatch'
        run: git fetch origin master && git reset --hard origin/master
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          release-type: simple
          target-branch: ${{ github.event.repository.default_branch }}
      - name: Download Chinese PDFs
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/download-artifact@v8
        with:
          name: boxes-and-diamonds-zh
          path: release-assets
      - name: Attach Chinese PDFs to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag_name }}"
          release-assets/zh-bd-screen.pdf
          release-assets/zh-bd-print.pdf
          --clobber
