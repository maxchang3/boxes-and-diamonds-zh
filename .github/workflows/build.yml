name: Build Boxes and Diamonds

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      olp_repository:
        description: 'Repository containing the matching OpenLogic-Zh fork (OWNER/REPO)'
        required: false
        type: string
      olp_ref:
        description: 'Branch or tag of the OpenLogic-Zh fork'
        required: false
        default: main
        type: string
  repository_dispatch:
    types: [olp-updated]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLP_REPOSITORY: ${{ inputs.olp_repository || github.event.client_payload.olp_repository || vars.OLP_REPOSITORY || format('{0}/OpenLogic-Zh', github.repository_owner) }}
  OLP_REF: ${{ inputs.olp_ref || github.event.client_payload.olp_ref || vars.OLP_REF || 'main' }}

jobs:
  resolve:
    name: Pin source revisions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bnd_sha: ${{ steps.revisions.outputs.bnd_sha }}
      olp_sha: ${{ steps.revisions.outputs.olp_sha }}
    steps:
      - name: Check out B&D source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && format('refs/heads/{0}', github.event.repository.default_branch) || github.sha }}
          path: boxes-and-diamonds-zh
          fetch-depth: 0
      - name: Check out OpenLogic source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ env.OLP_REF }}
          path: OpenLogic-Zh
          fetch-depth: 0
      - name: Test sync message generator
        working-directory: boxes-and-diamonds-zh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest scripts/test_openlogic_sync_message.py
      - name: Record exact revisions
        id: revisions
        run: |
          printf 'bnd_sha=%s\n' "$(git -C boxes-and-diamonds-zh rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'olp_sha=%s\n' "$(git -C OpenLogic-Zh rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect shared-layer changes
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.bnd_sha }}
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'repository_dispatch'
        with:
          filters: |
            shared:
              - 'include/**'
              - 'bd.tex'
              - 'bd-*.tex'
              - 'bd-*.sty'
              - 'olprevision.tex'
              - '.github/**'
              - 'scripts/**'

  build-english:
    name: Build English comparison
    needs: [changes, resolve]
    if: >-
      needs.changes.outputs.shared == 'true' &&
      (github.event_name != 'push' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out B&D source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.bnd_sha }}
          path: boxes-and-diamonds-zh
          fetch-depth: 1
      - name: Check out matching Open Logic fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.olp_sha }}
          path: OpenLogic-Zh
      - name: Fetch cover portraits
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/fetch-portraits.sh
      - name: Install poppler-utils for PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Generate build metadata
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/stamp-olprevision.sh ../OpenLogic-Zh
      - name: Compile English screen PDF
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: bd-screen.tex
          working_directory: boxes-and-diamonds-zh
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check English output
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/check-build.sh bd-screen

  build-chinese:
    name: Build Chinese release PDFs (${{ matrix.target }})
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      (github.event_name != 'push' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [screen, print]
    steps:
      - name: Check out B&D source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.bnd_sha }}
          path: boxes-and-diamonds-zh
          fetch-depth: 1
      - name: Check out matching Open Logic fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.olp_sha }}
          path: OpenLogic-Zh
      - name: Fetch cover portraits
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/fetch-portraits.sh
      - name: Install poppler-utils for PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Generate build metadata
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/stamp-olprevision.sh ../OpenLogic-Zh
      - name: Compile Chinese PDF
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: zh-bd-${{ matrix.target }}.tex
          working_directory: boxes-and-diamonds-zh
          args: -xelatex -interaction=nonstopmode -halt-on-error
      - name: Check Chinese output
        working-directory: boxes-and-diamonds-zh
        run: sh scripts/check-build.sh zh-bd-${{ matrix.target }}
      - name: Upload Chinese PDF and dependency data
        uses: actions/upload-artifact@v7
        with:
          name: boxes-and-diamonds-zh-${{ matrix.target }}
          path: |
            boxes-and-diamonds-zh/zh-bd-${{ matrix.target }}.pdf
            boxes-and-diamonds-zh/zh-bd-${{ matrix.target }}.fls

  sync:
    name: Sync OpenLogic revision
    needs: [resolve, build-chinese]
    if: >-
      github.event_name == 'repository_dispatch' &&
      needs.resolve.result == 'success' &&
      needs.build-chinese.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pinned B&D source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.bnd_sha }}
          path: boxes-and-diamonds-zh
          fetch-depth: 0
      - name: Check out pinned OpenLogic source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OLP_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.olp_sha }}
          path: OpenLogic-Zh
          fetch-depth: 0
      - name: Download build dependency data
        uses: actions/download-artifact@v8
        with:
          pattern: boxes-and-diamonds-zh-*
          path: build-inputs
          merge-multiple: true
      - name: Verify default branch is still pinned
        working-directory: boxes-and-diamonds-zh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PINNED_BND_SHA: ${{ needs.resolve.outputs.bnd_sha }}
        run: |
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          current=$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")
          if [ "$current" != "$PINNED_BND_SHA" ]; then
            echo "default branch advanced during build; refusing to sync" >&2
            exit 1
          fi
      - name: Generate semantic sync message
        working-directory: boxes-and-diamonds-zh
        env:
          OLP_REPOSITORY: ${{ env.OLP_REPOSITORY }}
          OLP_SHA: ${{ needs.resolve.outputs.olp_sha }}
        run: |
          python3 scripts/openlogic-sync-message.py \
            --repo ../OpenLogic-Zh \
            --revision-file olprevision.tex \
            --new-revision "$OLP_SHA" \
            --fls ../build-inputs/zh-bd-screen.fls ../build-inputs/zh-bd-print.fls \
            --source-repo-name "$OLP_REPOSITORY" \
            --output "$RUNNER_TEMP/openlogic-sync-message"
      - name: Stamp and commit synchronized revision
        working-directory: boxes-and-diamonds-zh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sh scripts/stamp-olprevision.sh ../OpenLogic-Zh
          if git diff --quiet -- olprevision.tex bdversion.tex; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olprevision.tex bdversion.tex
          git commit --file "$RUNNER_TEMP/openlogic-sync-message"
          git push origin "HEAD:$DEFAULT_BRANCH"

  release-please:
    name: Prepare or publish release
    if: >-
      always() &&
      needs.build-chinese.result == 'success' &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'repository_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build-chinese, sync]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          release-type: simple
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Download screen PDF
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/download-artifact@v8
        with:
          name: boxes-and-diamonds-zh-screen
          path: release-assets
      - name: Download print PDF
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/download-artifact@v8
        with:
          name: boxes-and-diamonds-zh-print
          path: release-assets
      - name: Attach Chinese PDFs to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag_name }}"
          release-assets/zh-bd-screen.pdf
          release-assets/zh-bd-print.pdf
          --repo "$GITHUB_REPOSITORY"
          --clobber
